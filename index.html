function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateTextQuestion() {
  const catList = Q_CATEGORIES[categoryCycleIndex];
  categoryCycleIndex = (categoryCycleIndex + 1) % Q_CATEGORIES.length;
  
  // Initialisation du suivi pour les questions du thème
  catList.forEach(q => {
    if (!qState[q.id]) {
      qState[q.id] = { asked: false, failed: false };
    }
  });

  const unasked = catList.filter(q => !qState[q.id].asked);
  const failed = catList.filter(q => qState[q.id].asked && qState[q.id].failed);

  let q = null;

  // Sélection pondérée (80% non posées / 70% échouées)
  if (unasked.length > 0) {
    if (Math.random() < 0.8) {
      q = unasked[Math.floor(Math.random() * unasked.length)];
    } else {
      q = catList[Math.floor(Math.random() * catList.length)];
    }
  } else {
    if (failed.length > 0 && Math.random() < 0.7) {
      q = failed[Math.floor(Math.random() * failed.length)];
    } else {
      q = catList[Math.floor(Math.random() * catList.length)];
    }
  }
  
  // Tirage statistique des propositions vraies (40%/30%/10%/5%/5%)
  const r = Math.random() * 90;
  let targetVrai = 1;
  if (r < 40) targetVrai = 1;
  else if (r < 70) targetVrai = 2;
  else if (r < 80) targetVrai = 3;
  else if (r < 85) targetVrai = 4;
  else targetVrai = 0;

  targetVrai = Math.min(targetVrai, q.vrais.length);
  let neededFaux = 4 - targetVrai;
  if (neededFaux > q.faux.length) {
    neededFaux = q.faux.length;
    targetVrai = 4 - neededFaux;
  }

  const selectedVrais = shuffle(q.vrais).slice(0, targetVrai);
  const selectedFaux = shuffle(q.faux).slice(0, neededFaux);

  let choices = [];
  selectedVrais.forEach(t => choices.push({ text: t, isCorrect: true }));
  selectedFaux.forEach(t => choices.push({ text: t, isCorrect: false }));

  choices = shuffle(choices);

  choices.push({
    text: "Aucune de ces propositions n'est exacte",
    isCorrect: targetVrai === 0,
    isNoneOption: true
  });

  return {
    id: q.id,
    title: q.title,
    choices: shuffle(choices),
    isSchema: false
  };
}

function generateSchemaQuestion() {
  const system = SCHEMA_SYSTEMS[Math.floor(Math.random() * SCHEMA_SYSTEMS.length)];
  const targetItem = system.items[Math.floor(Math.random() * system.items.length)];
  const isCorrectPresent = Math.random() < 0.7;

  const sameSysOthers = shuffle(system.items.filter(it => it.file !== targetItem.file).map(it => it.text)).slice(0, 3);
  
  let otherPool = [];
  SCHEMA_SYSTEMS.forEach(sys => {
    sys.items.forEach(it => {
      if (it.file !== targetItem.file && !sameSysOthers.includes(it.text)) {
        otherPool.push(it.text);
      }
    });
  });
  otherPool = shuffle(otherPool);

  let choices = [];
  if (isCorrectPresent) {
    choices.push({ text: targetItem.text, isCorrect: true });
    sameSysOthers.forEach(txt => choices.push({ text: txt, isCorrect: false }));
  } else {
    sameSysOthers.forEach(txt => choices.push({ text: txt, isCorrect: false }));
    choices.push({ text: otherPool[0], isCorrect: false });
  }

  choices = shuffle(choices);
  choices.push({
    text: "Aucune de ces propositions n'est exacte",
    isCorrect: !isCorrectPresent,
    isNoneOption: true
  });

  return {
    title: system.title,
    imageFile: targetItem.file,
    choices: shuffle(choices),
    isSchema: true
  };
}

function loadNextQuestion() {
  isSubmitted = false;
  selectedIndices.clear();
  document.getElementById("resultBadge").className = "result-badge";
  document.getElementById("actionBtn").innerText = "Valider";

  globalQuestionCounter++;

  if (globalQuestionCounter % 5 === 0) {
    currentQuestion = generateSchemaQuestion();
  } else {
    currentQuestion = generateTextQuestion();
  }

  renderQuestion();
}

function renderQuestion() {
  document.getElementById("questionTitle").innerText = currentQuestion.title;
  
  const imgBox = document.getElementById("imageBox");
  if (currentQuestion.isSchema) {
    document.getElementById("schemaImg").src = currentQuestion.imageFile;
    imgBox.style.display = "flex";
  } else {
    imgBox.style.display = "none";
  }

  const grid = document.getElementById("optionsGrid");
  grid.innerHTML = "";

  const letters = ["A", "B", "C", "D", "E"];
  currentQuestion.choices.forEach((choice, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${choice.text}</span>`;
    btn.onclick = () => toggleOption(idx);
    grid.appendChild(btn);
  });
}

function toggleOption(idx) {
  if (isSubmitted) return;

  const choice = currentQuestion.choices[idx];
  if (choice.isNoneOption) {
    selectedIndices.clear();
    selectedIndices.add(idx);
  } else {
    const noneIdx = currentQuestion.choices.findIndex(c => c.isNoneOption);
    if (noneIdx !== -1) selectedIndices.delete(noneIdx);
    
    if (selectedIndices.has(idx)) {
      selectedIndices.delete(idx);
    } else {
      selectedIndices.add(idx);
    }
  }

  const btns = document.querySelectorAll(".option-btn");
  btns.forEach((btn, i) => {
    btn.classList.toggle("selected", selectedIndices.has(i));
  });
}

function handleAction() {
  if (isSubmitted) {
    loadNextQuestion();
    return;
  }

  isSubmitted = true;
  let isPerfect = true;

  const btns = document.querySelectorAll(".option-btn");
  currentQuestion.choices.forEach((choice, i) => {
    const isSelected = selectedIndices.has(i);
    const isCorrect = choice.isCorrect;

    if (isSelected && isCorrect) {
      btns[i].classList.add("correct-checked");
    } else if (isSelected && !isCorrect) {
      btns[i].classList.add("wrong-checked");
      isPerfect = false;
    } else if (!isSelected && isCorrect) {
      btns[i].classList.add("missed-correct");
      isPerfect = false;
    }
  });

  // Mise à jour de l'état d'apprentissage
  if (!currentQuestion.isSchema && currentQuestion.id) {
    qState[currentQuestion.id].asked = true;
    qState[currentQuestion.id].failed = !isPerfect;
  }

  const badge = document.getElementById("resultBadge");
  badge.innerText = isPerfect ? "BON !" : "PAS BON";
  badge.className = isPerfect ? "result-badge correct" : "result-badge incorrect";
  
  document.getElementById("actionBtn").innerText = "Question suivante →";
}

document.addEventListener("keydown", (e) => {
  const key = e.key.toUpperCase();
  const map = { "A": 0, "1": 0, "B": 1, "2": 1, "C": 2, "3": 2, "D": 3, "4": 3, "E": 4, "5": 4 };
  if (key in map) toggleOption(map[key]);
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleAction(); }
});

loadNextQuestion();
</script>
</body>
</html>
